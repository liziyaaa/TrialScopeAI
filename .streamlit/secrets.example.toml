# Copy this file to .streamlit/secrets.toml for local development.
# Never commit the real secrets.toml file.
DEEPSEEK_API_KEY = "replace-with-a-new-key"
DEEPSEEK_MODEL = "deepseek-v4-flash"
ENABLE_LIVE_LLM = true

# Optional: Feishu collaborative review. Never commit real credentials.
ENABLE_FEISHU_SYNC = false
FEISHU_APP_ID = "replace-with-feishu-app-id"
FEISHU_APP_SECRET = "replace-with-feishu-app-secret"
FEISHU_BITABLE_APP_TOKEN = "replace-with-base-token"
FEISHU_CRITERIA_TABLE_ID = "replace-with-criteria-table-id"
FEISHU_SNAPSHOT_TABLE_ID = "replace-with-snapshot-table-id"
FEISHU_VALIDATION_TABLE_ID = "replace-with-validation-table-id"
FEISHU_BITABLE_URL = "https://example.feishu.cn/base/replace-with-base-token"
